user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml font/truetype font/opentype
        application/vnd.ms-fontobject image/svg+xml;

    # ── Rate limiting — protège l'API contre les abus ────────────────────
    # Zone mémoire partagée de 10 Mo — ~160 000 adresses IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Redirection HTTP → HTTPS ─────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name immosn.cloud www.immosn.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        server_name immosn.cloud www.immosn.cloud;

        ssl_certificate /etc/letsencrypt/live/immosn.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/immosn.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        # Suite de chiffrement moderne — supprime les suites faibles
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!MD5:!RC4;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        resolver 127.0.0.11 ipv6=off valid=30s;

        # ── En-têtes de sécurité ─────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        # CSP : autorise les sources nécessaires à l'app (Cloudinary, Leaflet tiles, Google Fonts)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://res.cloudinary.com https://*.tile.openstreetmap.org; connect-src 'self' https://api.cloudinary.com https://nominatim.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none';" always;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 20M;

        # ── Frontend Vue Router — SPA fallback ──────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Assets statiques — cache long terme ─────────────────────────
        location ~* \.(?:css|js|json|xml|txt|map|woff2?|woff|ttf|eot|svg|ico|png|jpe?g|gif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Auth endpoints — rate limiting strict (10 req/min) ──────────
        location ~* ^/api/v1/auth/(login|register) {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── API REST — reverse proxy avec rate limiting ──────────────────
        # Sans ^~ : les regex (auth) sont évaluées en priorité avant ce fallback
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # ── Bloquer les endpoints sensibles ────────────────────────────
        location /h2-console {
            return 403;
        }

        # Actuator : seul /actuator/health est exposé (par Spring config)
        # mais on bloque l'accès externe aux autres endpoints actuator par précaution
        location /actuator {
            return 403;
        }
    }
}
