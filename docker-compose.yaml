version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - frontend

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge