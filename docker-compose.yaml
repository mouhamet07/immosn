# ══════════════════════════════════════════════════════════
# ImmoSN — Docker Compose production (PostgreSQL Neon)
#
# Prérequis : fichier .env à la racine avec DATABASE_URL et JWT_SECRET
#   cp .env.example .env && nano .env
#
# Utilisation :
#   docker compose up --build -d
# ══════════════════════════════════════════════════════════

services:

  # ── Backend Spring Boot (Neon PostgreSQL) ────────────────
  backend:
    build: ./backend
    container_name: immosn-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: neon
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/annonces"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Nginx (frontend + reverse proxy) ────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL:                   /api/v1
        VITE_CLOUDINARY_CLOUD_NAME:     ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET:  ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
    container_name: immosn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
