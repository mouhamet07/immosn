# ══════════════════════════════════════════════════════════
# ImmoSN — Docker Compose production (PostgreSQL Neon)
#
# Prérequis : fichier .env à la racine
#   cp .env.example .env
#   # Renseigner DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET
#
# Utilisation :
#   docker compose up --build -d
#   docker compose logs -f backend   # surveiller le démarrage
# ══════════════════════════════════════════════════════════

services:

  # ── Backend Spring Boot (Neon PostgreSQL) ────────────────
  backend:
    build: ./backend
    container_name: immosn-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: neon
      SERVER_PORT: 8080
      # Surcharger explicitement pour éviter toute ambiguïté avec l'env hôte
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      DDL_AUTO: ${DDL_AUTO:-update}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@immosn.sn}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_NOM: ${SUPER_ADMIN_NOM:-Super Administrateur}
      SUPER_ADMIN_TELEPHONE: ${SUPER_ADMIN_TELEPHONE:-+221770000000}
      CONTRAT_EXPIRATION_CRON: ${CONTRAT_EXPIRATION_CRON:-0 5 0 * * *}
    networks:
      - app-network
    healthcheck:
      # --spider envoie HEAD — SecurityConfig n'autorise que GET → 403 → exit=8 unhealthy
      # -O /dev/null envoie GET → 200 → exit=0 healthy
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/api/v1/annonces"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ── Nginx (frontend + reverse proxy) ────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL:                   /api/v1
        VITE_CLOUDINARY_CLOUD_NAME:     ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET:  ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
    container_name: immosn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
