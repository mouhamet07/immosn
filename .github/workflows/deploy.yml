name: CD — Déploiement VPS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # ne jamais interrompre un déploiement en cours

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Déploiement VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # pas besoin d'historique pour le déploiement
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ignore exit code : keyscan retourne 1 si une seule négociation échoue,
          # même quand les autres types (rsa/ecdsa/ed25519) ont bien été récupérés
          ssh-keyscan -v -T 10 -t rsa,ecdsa,ed25519 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>&1 || true
          echo "--- known_hosts content ---"
          cat ~/.ssh/known_hosts || true
          echo "--- end known_hosts ---"
          # Séparer les clés des logs verbeux
          ssh-keyscan -T 10 -t rsa,ecdsa,ed25519 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null || true

          # Ce qui compte : known_hosts doit contenir au moins une empreinte
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts est vide — le VPS ($SSH_HOST:$SSH_PORT) est injoignable depuis GitHub Actions."
            echo "Vérifiez : firewall VPS, IP publique correcte dans VPS_HOST, port ouvert."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << SSHCFG
          Host vps
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 10
            ServerAliveCountMax 6
            TCPKeepAlive yes
            StrictHostKeyChecking yes
          SSHCFG
      - name: Vérification connectivité SSH
        run: ssh vps 'echo "SSH OK — $(hostname)"'
      - name: Deploy to VPS
        run: |
          ssh vps << 'EOF'
            set -euo pipefail
            cd /root/immosn
            echo "=== [1/4] Pull code ==="
            git pull origin master
            echo "=== [2/4] Build & restart containers ==="
            docker compose pull --quiet 2>/dev/null || true
            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d
            echo "=== [3/4] Healthcheck backend (max 4 min) ==="
            DEADLINE=$(( $(date +%s) + 240 ))
            HEALTHY=false
            until [ "$(date +%s)" -ge "$DEADLINE" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' immosn-backend 2>/dev/null || echo "unknown")
              echo "  $(date +%T) — statut: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "  Container marqué unhealthy, inutile d'attendre."
                break
              fi
              sleep 8
            done
            echo "=== [4/4] Résultat ==="
            if [ "$HEALTHY" = "true" ]; then
              echo "DEPLOY SUCCESS"
              docker image prune -f
            else
              echo "::error::DEPLOY FAILED — backend non healthy après 4 min"
              exit 1
            fi
          EOF
      - name: Logs backend (sur échec)
        if: failure()
        run: |
          ssh vps 'docker logs immosn-backend --tail 150 2>/dev/null || echo "Container introuvable"' || true
          ssh vps 'docker compose ps 2>/dev/null || true' || true
