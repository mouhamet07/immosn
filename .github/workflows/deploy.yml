name: CI/CD ImmoSN

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests unitaires & SonarQube
    runs-on: ubuntu-latest
    env:
      SUPER_ADMIN_PASSWORD: ci-test-password
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # requis par SonarQube pour l'analyse blame/historique
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Tests unitaires (backend)
        working-directory: backend
        run: mvn test -B
      - name: Upload rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7
      - name: Analyse SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          cd backend && mvn sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectBaseDir="${{ github.workspace }}" \
            -B

  deploy:
    name: Déploiement VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 30 -p "${SSH_PORT}" -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan attempt $i/5 failed, retrying in 15s..."
            sleep 15
          done
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${SSH_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /root/immosn
            echo "=== Pull code ==="
            git pull origin master
            echo "=== Build containers ==="
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            echo "=== Wait backend startup ==="
            sleep 40
            echo "=== Healthcheck backend ==="
            HEALTHY=false
            for i in $(seq 1 20); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' immosn-backend 2>/dev/null || echo "starting")
              echo "Attempt $i/20 - Status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              sleep 10
            done
            if [ "$HEALTHY" != "true" ]; then
              echo "=== DEPLOY FAILED ==="
              docker logs immosn-backend --tail 100 || true
              exit 1
            fi
            echo "=== DEPLOY SUCCESS ==="
            docker image prune -f
          EOF
