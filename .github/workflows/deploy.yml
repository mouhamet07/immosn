name: Deploy ImmoSN

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Retry logic pour ssh-keyscan avec timeout augmenté
          echo "Tentative de connexion SSH..."
          MAX_RETRIES=5
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            ssh-keyscan -T 20 -t rsa,ecdsa,ed25519 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null && break
            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Tentative $RETRY/$MAX_RETRIES échouée, nouvelle tentative dans 3s..."
              sleep 3
            fi
          done
          
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Impossible de joindre le VPS après $MAX_RETRIES tentatives"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          echo "✓ Clés SSH configurées"

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH OK — $(hostname)"'

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" << 'EOF'
            set -euo pipefail
            cd /root/immosn
            echo "=== [1/4] Pull code ==="
            git pull origin master
            echo "=== [2/4] Build & restart containers ==="
            docker compose up -d --build
            echo "=== [3/4] Healthcheck backend (max 4 min) ==="
            DEADLINE=$(( $(date +%s) + 240 ))
            HEALTHY=false
            until [ "$(date +%s)" -ge "$DEADLINE" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' immosn-backend 2>/dev/null || echo "starting")
              echo "  $(date +%T) — $STATUS"
              [ "$STATUS" = "healthy" ] && HEALTHY=true && break
              [ "$STATUS" = "unhealthy" ] && break
              sleep 10
            done
            echo "=== [4/4] Résultat ==="
            if [ "$HEALTHY" = "true" ]; then
              echo "DEPLOY SUCCESS"
              docker image prune -f
            else
              echo "::error::DEPLOY FAILED — backend non healthy"
              docker logs immosn-backend --tail 100 || true
              exit 1
            fi
          EOF

      - name: Logs backend (sur échec)
        if: failure()
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'docker logs immosn-backend --tail 150 2>/dev/null || true' || true
