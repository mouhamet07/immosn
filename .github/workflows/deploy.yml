name: Deploy ImmoSN

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -t rsa,ecdsa,ed25519 -p "${{ secrets.VPS_SSH_PORT || '22' }}" "${{ secrets.VPS_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts vide — VPS injoignable (${{ secrets.VPS_HOST }})"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.VPS_SSH_PORT || '22' }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'echo "SSH OK — $(hostname)"'

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.VPS_SSH_PORT || '22' }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -euo pipefail
            cd /root/immosn
            echo "=== [1/4] Pull code ==="
            git pull origin master
            echo "=== [2/4] Build & restart containers ==="
            docker compose up -d --build
            echo "=== [3/4] Healthcheck backend (max 4 min) ==="
            DEADLINE=$(( $(date +%s) + 240 ))
            HEALTHY=false
            until [ "$(date +%s)" -ge "$DEADLINE" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' immosn-backend 2>/dev/null || echo "starting")
              echo "  $(date +%T) — $STATUS"
              [ "$STATUS" = "healthy" ] && HEALTHY=true && break
              [ "$STATUS" = "unhealthy" ] && break
              sleep 10
            done
            echo "=== [4/4] Résultat ==="
            if [ "$HEALTHY" = "true" ]; then
              echo "DEPLOY SUCCESS"
              docker image prune -f
            else
              echo "::error::DEPLOY FAILED — backend non healthy"
              docker logs immosn-backend --tail 100 || true
              exit 1
            fi
          EOF

      - name: Logs backend (sur échec)
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.VPS_SSH_PORT || '22' }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'docker logs immosn-backend --tail 150 2>/dev/null || true' || true
