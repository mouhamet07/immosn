# DataSource Neon PostgreSQL
# channel_binding=disable requis pour Neon serverless (connexions intermittentes sans ça)
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&channel_binding=disable
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de connexions HikariCP — calibré pour Neon PostgreSQL serverless
# Neon ferme les connexions idle après ~5 min (300s). Les paramètres ci-dessous
# garantissent que HikariCP retire les connexions AVANT que Neon ne les ferme,
# supprimant le WARN "This connection has been closed."
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# 30s : cold start Neon serverless peut dépasser 10s après longue inactivité
spring.datasource.hikari.connection-timeout=30000
# 2 min : retire les connexions idle bien avant le seuil Neon de 5 min
spring.datasource.hikari.idle-timeout=120000
# 4 min : durée de vie max < timeout Neon (~5 min) — connexions retirées avant fermeture côté Neon
spring.datasource.hikari.max-lifetime=240000
# 30s : keepalive fréquent pour maintenir vivantes les connexions actives du pool
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 console désactivée en production
spring.h2.console.enabled=false

# CORS — origines autorisées en production (HTTPS obligatoire après migration nginx)
app.cors.allowed-origins=https://immosn.cloud,https://www.immosn.cloud

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging production 
logging.file.path=${LOG_PATH:/app/logs}

# Niveaux production : INFO pour code app, WARN pour les frameworks
logging.level.root=INFO
logging.level.sn.immosn=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Swagger/OpenAPI désactivé en production (exposition docs interdite)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Pas de couleurs ANSI dans les fichiers de logs
spring.output.ansi.enabled=NEVER

# Actuator — health endpoint dédié (utilisé par le healthcheck Docker)
# N'expose que /actuator/health — aucun endpoint sensible
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# DB désactivée dans le health check : évite timeout HikariCP > timeout Docker
# quand Neon suspend les connexions idle
management.health.db.enabled=false
