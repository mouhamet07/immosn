# DataSource Neon PostgreSQL
# channel_binding=disable requis pour Neon serverless (connexions intermittentes sans ça)
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&channel_binding=disable
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# 10s : fail-fast suffisant pour le cold start Neon (1-4s) + overhead réseau
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 console désactivée en production
spring.h2.console.enabled=false

# CORS — origines autorisées en production (HTTPS obligatoire après migration nginx)
app.cors.allowed-origins=https://immosn.cloud,https://www.immosn.cloud

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging production 
logging.file.path=${LOG_PATH:/app/logs}

# Niveaux production : INFO pour code app, WARN pour les frameworks
logging.level.root=INFO
logging.level.sn.immosn=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
# DEBUG temporaire springdoc — à supprimer après diagnostic du 500
logging.level.org.springdoc=DEBUG

# Pas de couleurs ANSI dans les fichiers de logs
spring.output.ansi.enabled=NEVER

# Actuator — health endpoint dédié (utilisé par le healthcheck Docker)
# N'expose que /actuator/health — aucun endpoint sensible
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# DB désactivée dans le health check : évite timeout HikariCP > timeout Docker
# quand Neon suspend les connexions idle
management.health.db.enabled=false
