# DataSource Neon PostgreSQL
# channel_binding=disable requis pour Neon serverless (connexions intermittentes sans ça)
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&channel_binding=disable
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ─────────────────────────────────────────────────────────────────────────────
# Pool HikariCP — calibré pour Neon PostgreSQL serverless (free tier)
#
# Stratégie :
#  1. HikariCP keepalive 30s  → empêche Neon de dormir pendant l'exécution
#  2. max-lifetime 4 min      → recycle les connexions AVANT le seuil Neon (~5 min)
#  3. initialization-fail-timeout=-1 → ne bloque pas le démarrage si Neon est en cold start
#  4. validation-timeout 5s   → détecte rapidement les connexions mortes
#  5. NeonWarmup (ApplicationRunner) → absorbe le cold start au démarrage
#  6. NeonHeartbeat (@Scheduled 4min) → double filet keepalive applicatif
#  7. DatabaseRetryAspect (AOP)       → retry transparent côté service
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# Timeout acquisition connexion depuis le pool (Neon cold start max ~10s, marge 30s)
spring.datasource.hikari.connection-timeout=30000
# Retire les connexions idle bien avant le seuil Neon de 5 min
spring.datasource.hikari.idle-timeout=120000
# Durée de vie max < timeout Neon (~5 min) — recycle avant fermeture Neon
spring.datasource.hikari.max-lifetime=240000
# Keepalive envoyé toutes les 30s sur les connexions idle (30s << 300s seuil Neon)
spring.datasource.hikari.keepalive-time=30000
# Timeout du SELECT 1 de validation — si > 5s, la connexion est considérée morte
spring.datasource.hikari.validation-timeout=5000
# -1 : ne pas bloquer le démarrage si Neon est en cold start (pool démarre vide,
# première connexion établie à la demande avec le timeout connection-timeout ci-dessus)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 console désactivée en production
spring.h2.console.enabled=false

# CORS — origines autorisées en production (HTTPS obligatoire après migration nginx)
app.cors.allowed-origins=https://immosn.cloud,https://www.immosn.cloud

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging production 
logging.file.path=${LOG_PATH:/app/logs}

# Niveaux production : INFO pour code app, WARN pour les frameworks
logging.level.root=INFO
logging.level.sn.immosn=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Swagger/OpenAPI désactivé en production (exposition docs interdite)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Pas de couleurs ANSI dans les fichiers de logs
spring.output.ansi.enabled=NEVER

# Actuator — health (healthcheck Docker) + prometheus (scraping métriques)
# On n'expose QUE ces deux endpoints — aucun autre endpoint sensible (env, beans, ...)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Tags communs sur toutes les métriques (utile pour filtrer dans Grafana)
management.metrics.tags.application=${spring.application.name}
# Histogrammes pour les latences HTTP (percentiles p95/p99 dans Grafana)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# DB désactivée dans le health check : évite timeout HikariCP > timeout Docker
# quand Neon suspend les connexions idle
management.health.db.enabled=false
