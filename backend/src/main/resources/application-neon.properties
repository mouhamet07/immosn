# ══════════════════════════════════════════════════════════
# Profil Neon PostgreSQL — activé par SPRING_PROFILES_ACTIVE=neon
#
# IMPORTANT : utiliser les variables séparées (pas DATABASE_URL brute)
# car le format libpq (postgresql://...) avec channel_binding=require
# n'est pas accepté par le driver JDBC org.postgresql.Driver.
#
# Variables requises dans .env :
#   DB_HOST   → ex: ep-xxx.us-east-1.aws.neon.tech
#   DB_NAME   → ex: neondb
#   DB_USER   → ex: neondb_owner
#   DB_PASSWORD → mot de passe Neon
# ══════════════════════════════════════════════════════════

# ── DataSource Neon PostgreSQL ─────────────────────────────
# URL construite depuis les variables séparées — évite channel_binding libpq
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ── Pool de connexions HikariCP ────────────────────────────
# Neon met en veille les connexions inactives — pool réduit + keepalive
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── H2 console désactivée en production ───────────────────
spring.h2.console.enabled=false

# ── JWT ────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Logging production ────────────────────────
# En Docker : LOG_PATH=/app/logs (defini dans docker-compose.prod.yml)
logging.file.path=${LOG_PATH:/app/logs}

# Niveaux production : INFO pour code app, WARN pour les frameworks
logging.level.root=INFO
logging.level.sn.immosn=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Pas de couleurs ANSI dans les fichiers de logs
spring.output.ansi.enabled=NEVER
