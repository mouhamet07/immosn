# ══════════════════════════════════════════════════════════
# Profil Neon PostgreSQL — activé par SPRING_PROFILES_ACTIVE=neon
#
# Neon est un service PostgreSQL serverless (https://neon.tech).
# La connexion string se récupère dans le dashboard Neon :
#   Settings > Connection Details > Connection string
#
# Format : jdbc:postgresql://user:password@host/dbname?sslmode=require
# ══════════════════════════════════════════════════════════

# ── DataSource Neon PostgreSQL ─────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ── Pool de connexions HikariCP ────────────────────────────
# Neon met en veille les connexions inactives — pool réduit conseillé
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Requis pour Neon (SSL obligatoire)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── H2 console désactivée en production ───────────────────
spring.h2.console.enabled=false

# ── JWT ────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
