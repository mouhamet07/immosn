# ══════════════════════════════════════════════════════════
# Profil MySQL — activé par SPRING_PROFILES_ACTIVE=mysql
# ══════════════════════════════════════════════════════════

# ── DataSource MySQL ───────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:immosn}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:immosn}
spring.datasource.password=${DB_PASSWORD:immosn123}

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── H2 Console désactivée en production ───────────────────
spring.h2.console.enabled=false

# ── JWT (surchargés par variables d'environnement) ─────────
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyInProductionImmosn2024}
jwt.expiration=${JWT_EXPIRATION:86400000}
