spring.application.name=backend

# Pagination
page.default.size=${PAGE_DEFAULT_SIZE:10}
page.admin.size=${PAGE_ADMIN_SIZE:20}

# Serveur
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
# Permet à Spring Boot de lire X-Forwarded-Proto/Host envoyés par Nginx
# et de générer les redirects en HTTPS au lieu de HTTP
server.forward-headers-strategy=FRAMEWORK

# Base de données — H2 (développement local uniquement)
spring.datasource.url=jdbc:h2:mem:apiv1db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:CHANGEME_USE_A_STRONG_64_CHAR_SECRET_IN_PRODUCTION_ENV}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:80}

# Bootstrap SUPER_ADMIN
app.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@immosn.sn}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:SuperAdmin@2026!}
app.super-admin.nom=${SUPER_ADMIN_NOM:Super Administrateur}
app.super-admin.telephone=${SUPER_ADMIN_TELEPHONE:+221770000000}

# Job expiration contrats
contrat.expiration.cron=${CONTRAT_EXPIRATION_CRON:0 5 0 * * *}

# Logging, Local : ./logs   |   Docker : /app/logs (defini dans docker-compose)
logging.file.path=${LOG_PATH:logs}

# Niveaux par defaut (logback-spring.xml prend le relai selon le profil)
logging.level.root=INFO
logging.level.sn.immosn=DEBUG

# Couleurs console en local
spring.output.ansi.enabled=ALWAYS

# Springdoc — OpenAPI / Swagger UI
springdoc.cache.disabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# Spring Boot 4 (Spring Framework 7) a supprimé ControllerAdviceBean(Object)
# que springdoc 2.6.0 appelle pour traiter les @ControllerAdvice → NoSuchMethodError
# Ce flag désactive ce traitement incompatible
springdoc.override-with-generic-response=false

# Actuator — health endpoint (Docker healthcheck)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.health.db.enabled=false
